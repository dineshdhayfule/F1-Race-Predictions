[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apexgrid"
version = "1.1.1"
description = "Formula 1 race outcome prediction engine using FastF1 telemetry and Monte Carlo simulation"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Dinesh Dhayfule", email = "dineshdhayfule@gmail.com" }
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.1.0,<3.0.0",
    "scipy>=1.11.0,<2.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "xgboost>=2.0.0,<4.0.0",
    "fastf1>=3.4.0,<4.0.0",
    "typer>=0.12.0,<1.0.0",
    "rich>=13.7.0,<15.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
apexgrid = "apexgrid.cli.typer_app:app"

[project.urls]
Homepage = "https://github.com/dineshdhayfule/F1-Race-Predictions"
Repository = "https://github.com/dineshdhayfule/F1-Race-Predictions"
Issues = "https://github.com/dineshdhayfule/F1-Race-Predictions/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["apexgrid*"]

[tool.setuptools.package-data]
apexgrid = ["config/*.json"]