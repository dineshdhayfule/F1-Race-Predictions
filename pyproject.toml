[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apexgrid"
version = "1.0.0"
description = "Predicting the Race Beyond the Grid — Formula 1 Motorsport Intelligence & Prediction Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.1.0,<3.0.0",
    "scipy>=1.11.0,<2.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "xgboost>=2.0.0,<4.0.0",
    "fastf1>=3.4.0,<4.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.scripts]
apexgrid = "src.cli.typer_app:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
